name = "agent-trust-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# ---- D1 (SQLite relational DB) ----
[[d1_databases]]
binding = "DB"
database_name = "agent-trust-db"
database_id = "686985b9-84bd-4448-8aa4-bdbb3e5228bc"
migrations_dir = "migrations"

# ---- KV (magic-link tokens + sessions) ----
[[kv_namespaces]]
binding = "SESSIONS"
id = "7be207ee08aa49edb8fa9f673c9bea43"

# ---- Cron: daily re-test gate (monthly logic inside handler) ----
[triggers]
crons = ["0 3 * * *"]

# ---- Non-secret vars ----
[vars]
APP_BASE_URL = "https://agent-trust-web.pages.dev"
API_BASE_URL = "http://localhost:8787"
VETTING_PRICE_CENTS = "40000"
MEMBERSHIP_PRICE_CENTS = "20000"
# Sign up with this email to be granted the admin role.
ADMIN_EMAIL = "parth.kshirsagar1410@gmail.com"

# Secrets (set via `npx wrangler secret put <NAME>`, or .dev.vars locally):
#   CLAUDE_API_KEY, STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, ENCRYPTION_KEY
#
# Note: R2 (agent-output blobs) and Queues (async run fan-out) were removed so
# the app runs on the Cloudflare free plan. Outputs are stored in D1; enqueued
# runs execute inline via ctx.waitUntil. Re-add both for scale (paid plan).
